name: GAMEZAAR Android Export

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Supabase export job ID'
        required: false
        type: string
      project_id:
        description: 'GAMEZAAR project ID'
        required: false
        type: string
  push:
    paths:
      - 'android-export/**'
      - '.github/workflows/android-export.yml'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Mark export as building
        if: ${{ github.event.inputs.job_id != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_ID: ${{ github.event.inputs.job_id }}
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_SERVICE_ROLE_KEY"
          curl --fail-with-body -sS -X PATCH "$SUPABASE_URL/rest/v1/export_jobs?id=eq.$JOB_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{"status":"building","progress_percent":5,"progress_step":"Preparing Android build","updated_at":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}'

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Progress — Source ready
        if: ${{ github.event.inputs.job_id != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_ID: ${{ github.event.inputs.job_id }}
        run: |
          curl --fail-with-body -sS -X PATCH "$SUPABASE_URL/rest/v1/export_jobs?id=eq.$JOB_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{"progress_percent":12,"progress_step":"Source code ready","updated_at":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Progress — Android tools
        if: ${{ github.event.inputs.job_id != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_ID: ${{ github.event.inputs.job_id }}
        run: |
          curl --fail-with-body -sS -X PATCH "$SUPABASE_URL/rest/v1/export_jobs?id=eq.$JOB_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{"progress_percent":25,"progress_step":"Android tools installed","updated_at":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build packages
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Progress — Dependencies
        if: ${{ github.event.inputs.job_id != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_ID: ${{ github.event.inputs.job_id }}
        run: |
          curl --fail-with-body -sS -X PATCH "$SUPABASE_URL/rest/v1/export_jobs?id=eq.$JOB_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{"progress_percent":38,"progress_step":"Installing app dependencies","updated_at":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}'

      - name: Install Capacitor dependencies
        working-directory: android-export
        run: npm install --no-audit --no-fund

      - name: Progress — Android project
        if: ${{ github.event.inputs.job_id != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_ID: ${{ github.event.inputs.job_id }}
        run: |
          curl --fail-with-body -sS -X PATCH "$SUPABASE_URL/rest/v1/export_jobs?id=eq.$JOB_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{"progress_percent":52,"progress_step":"Generating Android project","updated_at":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}'

      - name: Generate Android project
        working-directory: android-export
        run: npx cap add android

      - name: Progress — App configuration
        if: ${{ github.event.inputs.job_id != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_ID: ${{ github.event.inputs.job_id }}
        run: |
          curl --fail-with-body -sS -X PATCH "$SUPABASE_URL/rest/v1/export_jobs?id=eq.$JOB_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{"progress_percent":66,"progress_step":"Configuring full-screen app","updated_at":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}'

      - name: Enable immersive full-screen Android display
        working-directory: android-export
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = next(Path("android/app/src/main/java").rglob("MainActivity.java"), None)
          if p is None:
              raise SystemExit("Capacitor MainActivity.java not found")
          s = p.read_text()
          if "SYSTEM_UI_FLAG_IMMERSIVE_STICKY" not in s:
              lines = s.splitlines()
              lines.insert(1, "")
              lines.insert(2, "import android.view.View;")
              s = "\n".join(lines)
              method = '''
              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                          | View.SYSTEM_UI_FLAG_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      );
                  }
              }
              '''
              pos = s.rfind("}")
              s = s[:pos] + method + "\n" + s[pos:]
              p.write_text(s)
          print("Immersive full-screen enabled in", p)
          PY

      - name: Sync web package
        working-directory: android-export
        run: npx cap sync android

      - name: Progress — APK and AAB build
        if: ${{ github.event.inputs.job_id != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_ID: ${{ github.event.inputs.job_id }}
        run: |
          curl --fail-with-body -sS -X PATCH "$SUPABASE_URL/rest/v1/export_jobs?id=eq.$JOB_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{"progress_percent":76,"progress_step":"Building APK and AAB","updated_at":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}'

      - name: Build APK and AAB
        working-directory: android-export
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease

      - name: Progress — Publishing downloads
        if: ${{ github.event.inputs.job_id != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_ID: ${{ github.event.inputs.job_id }}
        run: |
          curl --fail-with-body -sS -X PATCH "$SUPABASE_URL/rest/v1/export_jobs?id=eq.$JOB_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{"progress_percent":93,"progress_step":"Publishing APK and AAB downloads","updated_at":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}'

      - name: Prepare release files
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          mkdir -p release-files
          cp android-export/android/app/build/outputs/apk/debug/app-debug.apk release-files/gamezaar.apk
          cp android-export/android/app/build/outputs/bundle/release/app-release.aab release-files/gamezaar.aab

      - name: Publish APK and AAB to GitHub Releases
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gamezaar-build-${{ github.run_number }}
          name: GAMEZAAR Android Build #${{ github.run_number }}
          body: |
            GAMEZAAR Android export.
            Commit: ${{ github.sha }}
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: |
            release-files/gamezaar.apk
            release-files/gamezaar.aab
          fail_on_unmatched_files: true
          make_latest: true

      - name: Mark export complete with GitHub download links
        if: ${{ success() && github.event.inputs.job_id != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_ID: ${{ github.event.inputs.job_id }}
          RELEASE_TAG: gamezaar-build-${{ github.run_number }}
        run: |
          set -e
          APK_URL="https://github.com/pranab14220/Gamezaar-Studio/releases/download/$RELEASE_TAG/gamezaar.apk"
          AAB_URL="https://github.com/pranab14220/Gamezaar-Studio/releases/download/$RELEASE_TAG/gamezaar.aab"
          curl --fail-with-body -sS -X PATCH "$SUPABASE_URL/rest/v1/export_jobs?id=eq.$JOB_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{"status":"completed","progress_percent":100,"progress_step":"Ready to download","apk_storage_path":"'"$APK_URL"'","aab_storage_path":"'"$AAB_URL"'","updated_at":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}'

      - name: Mark export failed
        if: ${{ failure() && github.event.inputs.job_id != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_ID: ${{ github.event.inputs.job_id }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            curl --silent --show-error -X PATCH "$SUPABASE_URL/rest/v1/export_jobs?id=eq.$JOB_ID" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              -H "Prefer: return=minimal" \
              -d '{"status":"failed","progress_step":"Build failed","error_message":"Android build failed. Check the build log.","updated_at":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}'
          fi

      - name: Upload APK and AAB build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gamezaar-android-builds
          path: |
            android-export/android/app/build/outputs/apk/debug/app-debug.apk
            android-export/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
