name: GAMEZAAR Android Export

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Supabase export job ID'
        required: false
        type: string
      project_id:
        description: 'GAMEZAAR project ID'
        required: false
        type: string
  push:
    paths:
      - 'android-export/**'
      - '.github/workflows/android-export.yml'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Mark export as building
        if: ${{ github.event.inputs.job_id != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_ID: ${{ github.event.inputs.job_id }}
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_SERVICE_ROLE_KEY"
          curl --fail-with-body -sS -X PATCH "$SUPABASE_URL/rest/v1/export_jobs?id=eq.$JOB_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{"status":"building","progress_percent":5,"progress_step":"Preparing Android build","updated_at":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}'

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare latest game editor as the Android web app
        run: cp car-racing-editor.html android-export/www/index.html

      - name: Prepare default AdMob test configuration
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("android-export/www/gamezaar-admob-config.json")
          if not p.exists():
              p.write_text(json.dumps({"testMode":True,"bannerOn":False,"interstitialOn":False,"rewardedOn":False}))
          PY

      - name: Load creator project and configure this Android app
        if: ${{ github.event.inputs.project_id != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROJECT_ID: ${{ github.event.inputs.project_id }}
        run: |
          set -e
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_SERVICE_ROLE_KEY"
          curl --fail-with-body -sS "$SUPABASE_URL/rest/v1/game_projects?select=id,name,game_type,settings&id=eq.$PROJECT_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Accept: application/json" > /tmp/gamezaar-project.json
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          rows = json.loads(Path("/tmp/gamezaar-project.json").read_text())
          if not rows:
              raise SystemExit("Creator project was not found in Supabase.")
          project = rows[0]
          if project.get("game_type") != "Car Traffic Racing":
              raise SystemExit("This custom export currently supports Car Traffic Racing only.")
          settings = project.get("settings") or {}
          if not isinstance(settings, dict):
              raise SystemExit("Creator game settings are invalid.")
          settings["name"] = project["name"]
          monetization = settings.get("monetization") or {}
          Path("android-export/www/gamezaar-admob-config.json").write_text(json.dumps({
              "testMode": monetization.get("testMode", True) is not False,
              "appId": monetization.get("appId", ""),
              "bannerOn": monetization.get("bannerOn", False) is True,
              "bannerId": monetization.get("bannerId", ""),
              "bannerPosition": monetization.get("bannerPosition", "bottom"),
              "interstitialOn": monetization.get("interstitialOn", False) is True,
              "interstitialId": monetization.get("interstitialId", ""),
              "rewardedOn": monetization.get("rewardedOn", False) is True,
              "rewardedId": monetization.get("rewardedId", "")
          }, separators=(",", ":"))

          css = """
          html.gz-exported-game body>header,
          html.gz-exported-game .top,
          html.gz-exported-game .panel.settings,
          html.gz-exported-game .savebar,
          html.gz-exported-game #gamezaarAuth,
          html.gz-exported-game #gzBuildBox,
          html.gz-exported-game #exportSystem,
          html.gz-exported-game .preview-fab,
          html.gz-exported-game .preview-modal {display:none!important}
          html.gz-exported-game main.wrap{width:100%;max-width:none;margin:0;padding:0}
          html.gz-exported-game .layout{display:block!important}
          html.gz-exported-game .preview-panel{display:block!important;width:100%;max-width:100%;margin:0;padding:8px;border:0;border-radius:0;background:transparent;box-shadow:none}
          html.gz-exported-game .preview-panel>.panel-head{display:none}
          /* True edge-to-edge Android game viewport: center on the device, not the editor page wrapper. */
          html.gz-exported-game,
          html.gz-exported-game body{width:100%;height:100%;min-height:100%;margin:0;padding:0;overflow:hidden}
          html.gz-exported-game main.wrap,
          html.gz-exported-game .layout,
          html.gz-exported-game .preview-panel{
            position:fixed!important;inset:0!important;width:100vw!important;height:100dvh!important;
            min-width:0!important;max-width:none!important;min-height:0!important;max-height:none!important;
            margin:0!important;padding:0!important;border:0!important;border-radius:0!important;
            display:block!important;overflow:hidden!important;transform:none!important;
          }
          html.gz-exported-game .preview-panel{background:transparent!important;box-shadow:none!important}
          /* Keep the same framed game container used by the website live preview. */
          html.gz-exported-game .game-shell{
            position:fixed!important;inset:8px 2px!important;z-index:1!important;
            display:flex!important;flex-direction:column!important;
            width:auto!important;height:auto!important;min-width:0!important;min-height:0!important;
            max-width:none!important;max-height:none!important;aspect-ratio:auto!important;
            margin:0!important;padding:8px 10px!important;
            border:1px solid #596681!important;border-radius:18px!important;
            background:linear-gradient(145deg,#252e42,#171d2d)!important;
            box-shadow:0 8px 22px #0007,inset 0 1px 0 #ffffff12!important;overflow:hidden!important;
            left:2px!important;right:2px!important;top:8px!important;bottom:8px!important;
            box-sizing:border-box!important;
          }
          html.gz-exported-game .game-shell .stage{
            position:relative!important;inset:auto!important;flex:1 1 auto!important;
            display:flex!important;align-items:center!important;justify-content:center!important;
            width:100%!important;height:auto!important;min-width:0!important;min-height:0!important;
            max-width:none!important;max-height:none!important;margin:0!important;padding:3px!important;
            border:2px solid #111a2d!important;border-radius:13px!important;
            background:#111a2d!important;overflow:hidden!important;box-sizing:border-box!important;
          }
          html.gz-exported-game .game-shell .stage canvas{
            /* The game script recalculates its logical canvas height from the live stage size.
               Fill that exact viewport so tall Android screens have no letterboxed empty bands. */
            display:block!important;width:100%!important;height:100%!important;
            min-width:0!important;min-height:0!important;max-width:100%!important;max-height:100%!important;
            aspect-ratio:auto!important;object-fit:fill!important;image-rendering:pixelated!important;
            border:0!important;border-radius:10px!important;
          }
          /* Box mode keeps HUD and controls in their own rows while the canvas fills the remaining height. */
          html.gz-exported-game .game-shell:not(.game-fullscreen-layout) .game-hud{
            position:relative!important;top:auto!important;left:auto!important;right:auto!important;
            flex:0 0 auto!important;width:100%!important;margin:0!important;padding:12px 8px!important;
          }
          html.gz-exported-game .game-shell:not(.game-fullscreen-layout) .control-pad{
            position:relative!important;left:auto!important;right:auto!important;bottom:auto!important;
            flex:0 0 48px!important;width:84%!important;margin:8px auto calc(8px + env(safe-area-inset-bottom))!important;
          }
          /* Full Screen mode overlays the HUD and steering on the same edge-to-edge canvas. */
          html.gz-exported-game .game-shell.game-fullscreen-layout .stage{
            position:absolute!important;inset:0!important;flex:none!important;width:100%!important;height:100%!important;
          }
          html.gz-exported-game .game-shell.game-fullscreen-layout .game-hud{
            position:absolute!important;z-index:5!important;top:calc(10px + env(safe-area-inset-top))!important;
            left:10px!important;right:10px!important;width:auto!important;margin:0!important;
          }
          html.gz-exported-game .game-shell.game-fullscreen-layout .control-pad{
            position:absolute!important;z-index:6!important;left:8%!important;bottom:calc(12px + env(safe-area-inset-bottom))!important;
            width:84%!important;margin:0!important;
          }
          """
          boot = (
              "(function(){const p=" + json.dumps({
                  "id": project["id"],
                  "name": project["name"],
                  "game_type": project["game_type"],
                  "settings": settings
              }, ensure_ascii=False, separators=(",", ":")) + ";"
              "localStorage.setItem('gamezaar_current_project',JSON.stringify({name:p.name,type:p.game_type,createdAt:new Date().toISOString()}));"
              "localStorage.setItem('gamezaar_racing_settings',JSON.stringify(p.settings));"
              "document.documentElement.classList.add('gz-exported-game');"
              "document.title=p.name;"
              "const s=document.createElement('style');s.textContent=" + json.dumps(css) + ";document.head.appendChild(s);"
              "})();"
          )

          web_index = Path("android-export/www/index.html")
          html = web_index.read_text()
          if "</head>" not in html:
              raise SystemExit("Android web app is missing its head section.")
          web_index.write_text(html.replace("</head>", '<script src="gamezaar-project.js"></script>\n</head>', 1))
          Path("android-export/www/gamezaar-project.js").write_text(boot)

          config_path = Path("android-export/capacitor.config.json")
          config = json.loads(config_path.read_text())
          safe_id = re.sub(r"[^a-f0-9]", "", project["id"].lower())[:12]
          config["appId"] = "in.gamezaar.creator.g" + safe_id
          config["appName"] = project["name"][:40]
          config_path.write_text(json.dumps(config, indent=2) + "\n")
          print("Configured custom Android package for:", project["name"])
          PY

      - name: Progress — Source ready
        if: ${{ github.event.inputs.job_id != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_ID: ${{ github.event.inputs.job_id }}
        run: |
          curl --fail-with-body -sS -X PATCH "$SUPABASE_URL/rest/v1/export_jobs?id=eq.$JOB_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{"progress_percent":12,"progress_step":"Source code ready","updated_at":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Progress — Android tools
        if: ${{ github.event.inputs.job_id != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_ID: ${{ github.event.inputs.job_id }}
        run: |
          curl --fail-with-body -sS -X PATCH "$SUPABASE_URL/rest/v1/export_jobs?id=eq.$JOB_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{"progress_percent":25,"progress_step":"Android tools installed","updated_at":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build packages
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Progress — Dependencies
        if: ${{ github.event.inputs.job_id != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_ID: ${{ github.event.inputs.job_id }}
        run: |
          curl --fail-with-body -sS -X PATCH "$SUPABASE_URL/rest/v1/export_jobs?id=eq.$JOB_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{"progress_percent":38,"progress_step":"Installing app dependencies","updated_at":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}'

      - name: Install Capacitor and AdMob dependencies
        working-directory: android-export
        run: |
          npm install --no-audit --no-fund
          npm run build:admob

      - name: Progress — Android project
        if: ${{ github.event.inputs.job_id != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_ID: ${{ github.event.inputs.job_id }}
        run: |
          curl --fail-with-body -sS -X PATCH "$SUPABASE_URL/rest/v1/export_jobs?id=eq.$JOB_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{"progress_percent":52,"progress_step":"Generating Android project","updated_at":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}'

      - name: Generate Android project
        working-directory: android-export
        run: npx cap add android

      - name: Configure Google AdMob Android application ID
        working-directory: android-export
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          config=json.loads(Path("www/gamezaar-admob-config.json").read_text())
          test_mode=config.get("testMode", True) is not False
          sample_app_id="ca-app-pub-3940256099942544~3347511713"
          active_ads=any(config.get(key, False) is True for key in ("bannerOn","interstitialOn","rewardedOn"))
          app_id=sample_app_id if test_mode or not active_ads else str(config.get("appId") or "").strip()
          if not app_id:
              raise SystemExit("Production AdMob App ID is required when Test Mode is OFF. Add it in Monetization & Ads.")
          manifest=Path("android/app/src/main/AndroidManifest.xml")
          source=manifest.read_text()
          metadata='<meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" android:value="@string/admob_app_id" />'
          if "com.google.android.gms.ads.APPLICATION_ID" not in source:
              source=source.replace("</application>", "        "+metadata+"\n    </application>")
          manifest.write_text(source)
          strings=Path("android/app/src/main/res/values/strings.xml")
          strings.parent.mkdir(parents=True, exist_ok=True)
          xml=strings.read_text() if strings.exists() else '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n</resources>\n'
          entry=f'<string name="admob_app_id">{app_id}</string>'
          if re.search(r'<string name="admob_app_id">.*?</string>', xml):
              xml=re.sub(r'<string name="admob_app_id">.*?</string>', entry, xml)
          else:
              xml=xml.replace("</resources>", "    "+entry+"\n</resources>")
          strings.write_text(xml)
          print("AdMob App ID configured:", "Google test App ID" if test_mode else "creator production App ID")
          PY

      - name: Progress — App configuration
        if: ${{ github.event.inputs.job_id != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_ID: ${{ github.event.inputs.job_id }}
        run: |
          curl --fail-with-body -sS -X PATCH "$SUPABASE_URL/rest/v1/export_jobs?id=eq.$JOB_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{"progress_percent":66,"progress_step":"Configuring full-screen app","updated_at":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}'

      - name: Enable immersive full-screen Android display
        working-directory: android-export
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = next(Path("android/app/src/main/java").rglob("MainActivity.java"), None)
          if p is None:
              raise SystemExit("Capacitor MainActivity.java not found")
          s = p.read_text()
          if "SYSTEM_UI_FLAG_IMMERSIVE_STICKY" not in s:
              lines = s.splitlines()
              lines.insert(1, "")
              lines.insert(2, "import android.view.View;")
              s = "\n".join(lines)
              method = '''
              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                          | View.SYSTEM_UI_FLAG_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      );
                  }
              }
              '''
              pos = s.rfind("}")
              s = s[:pos] + method + "\n" + s[pos:]
              p.write_text(s)
          print("Immersive full-screen enabled in", p)
          PY

      - name: Sync web package
        working-directory: android-export
        run: npx cap sync android

      - name: Progress — APK and AAB build
        if: ${{ github.event.inputs.job_id != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_ID: ${{ github.event.inputs.job_id }}
        run: |
          curl --fail-with-body -sS -X PATCH "$SUPABASE_URL/rest/v1/export_jobs?id=eq.$JOB_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{"progress_percent":76,"progress_step":"Building APK and AAB","updated_at":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}'

      - name: Build APK and AAB
        working-directory: android-export
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease

      - name: Progress — Publishing downloads
        if: ${{ github.event.inputs.job_id != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_ID: ${{ github.event.inputs.job_id }}
        run: |
          curl --fail-with-body -sS -X PATCH "$SUPABASE_URL/rest/v1/export_jobs?id=eq.$JOB_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{"progress_percent":93,"progress_step":"Publishing APK and AAB downloads","updated_at":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}'

      - name: Prepare release files
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          mkdir -p release-files
          cp android-export/android/app/build/outputs/apk/debug/app-debug.apk release-files/gamezaar.apk
          cp android-export/android/app/build/outputs/bundle/release/app-release.aab release-files/gamezaar.aab

      - name: Publish APK and AAB to GitHub Releases
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gamezaar-build-${{ github.run_number }}
          name: GAMEZAAR Android Build #${{ github.run_number }}
          body: |
            GAMEZAAR Android export.
            Commit: ${{ github.sha }}
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: |
            release-files/gamezaar.apk
            release-files/gamezaar.aab
          fail_on_unmatched_files: true
          make_latest: true

      - name: Mark export complete with GitHub download links
        if: ${{ success() && github.event.inputs.job_id != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_ID: ${{ github.event.inputs.job_id }}
          RELEASE_TAG: gamezaar-build-${{ github.run_number }}
        run: |
          set -e
          APK_URL="https://github.com/pranab14220/Gamezaar-Studio/releases/download/$RELEASE_TAG/gamezaar.apk"
          AAB_URL="https://github.com/pranab14220/Gamezaar-Studio/releases/download/$RELEASE_TAG/gamezaar.aab"
          curl --fail-with-body -sS -X PATCH "$SUPABASE_URL/rest/v1/export_jobs?id=eq.$JOB_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{"status":"completed","progress_percent":100,"progress_step":"Ready to download","apk_storage_path":"'"$APK_URL"'","aab_storage_path":"'"$AAB_URL"'","updated_at":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}'

      - name: Mark export failed
        if: ${{ failure() && github.event.inputs.job_id != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_ID: ${{ github.event.inputs.job_id }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            curl --silent --show-error -X PATCH "$SUPABASE_URL/rest/v1/export_jobs?id=eq.$JOB_ID" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              -H "Prefer: return=minimal" \
              -d '{"status":"failed","progress_step":"Build failed","error_message":"Android build failed. Check the build log.","updated_at":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}'
          fi

      - name: Upload APK and AAB build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gamezaar-android-builds
          path: |
            android-export/android/app/build/outputs/apk/debug/app-debug.apk
            android-export/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
