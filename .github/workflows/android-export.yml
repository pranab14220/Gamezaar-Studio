name: GAMEZAAR Android Export

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Capacitor dependencies
        working-directory: android-export
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        working-directory: android-export
        run: npx cap add android

      - name: Sync web package
        working-directory: android-export
        run: npx cap sync android

      - name: Build APK and AAB
        working-directory: android-export
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: gamezaar-android-builds
          path: |
            android-export/android/app/build/outputs/apk/debug/app-debug.apk
            android-export/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
