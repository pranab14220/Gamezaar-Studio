name: GAMEZAAR Android Export

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Supabase export job ID'
        required: false
        type: string
      project_id:
        description: 'GAMEZAAR project ID'
        required: false
        type: string
  push:
    paths:
      - 'android-export/**'
      - '.github/workflows/android-export.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Mark export as building
        if: ${{ github.event.inputs.job_id != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_ID: ${{ github.event.inputs.job_id }}
        run: |
          test -n "$SUPABASE_URL" && test -n "$SUPABASE_SERVICE_ROLE_KEY"
          curl --fail-with-body -sS -X PATCH "$SUPABASE_URL/rest/v1/export_jobs?id=eq.$JOB_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{"status":"building","updated_at":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}'

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build packages
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Capacitor dependencies
        working-directory: android-export
        run: npm install --no-audit --no-fund

      - name: Generate Android project
        working-directory: android-export
        run: npx cap add android

      - name: Enable immersive full-screen Android display
        working-directory: android-export
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = next(Path("android/app/src/main/java").rglob("MainActivity.java"), None)
          if p is None:
              raise SystemExit("Capacitor MainActivity.java not found")
          s = p.read_text()
          if "SYSTEM_UI_FLAG_IMMERSIVE_STICKY" not in s:
              lines = s.splitlines()
              lines.insert(1, "")
              lines.insert(2, "import android.view.View;")
              s = "\n".join(lines)
              method = '''
              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) {
                      getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                          | View.SYSTEM_UI_FLAG_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                          | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                          | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                      );
                  }
              }
              '''
              pos = s.rfind("}")
              s = s[:pos] + method + "\n" + s[pos:]
              p.write_text(s)
          print("Immersive full-screen enabled in", p)
          PY

      - name: Sync web package
        working-directory: android-export
        run: npx cap sync android

      - name: Build APK and AAB
        id: build
        working-directory: android-export
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease

      - name: Upload APK and AAB to Supabase Storage
        if: ${{ success() && github.event.inputs.job_id != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_ID: ${{ github.event.inputs.job_id }}
        run: |
          set -e
          APK_PATH="android-export/android/app/build/outputs/apk/debug/app-debug.apk"
          AAB_PATH="android-export/android/app/build/outputs/bundle/release/app-release.aab"
          APK_OBJECT="$JOB_ID/gamezaar.apk"
          AAB_OBJECT="$JOB_ID/gamezaar.aab"
          curl --fail-with-body -sS -X POST "$SUPABASE_URL/storage/v1/object/gamezaar-exports/$APK_OBJECT" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "x-upsert: true" --data-binary "@$APK_PATH"
          curl --fail-with-body -sS -X POST "$SUPABASE_URL/storage/v1/object/gamezaar-exports/$AAB_OBJECT" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/octet-stream" \
            -H "x-upsert: true" --data-binary "@$AAB_PATH"
          curl --fail-with-body -sS -X PATCH "$SUPABASE_URL/rest/v1/export_jobs?id=eq.$JOB_ID" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d '{"status":"completed","apk_storage_path":"'"$APK_OBJECT"'","aab_storage_path":"'"$AAB_OBJECT"'","updated_at":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}'

      - name: Mark export failed
        if: ${{ failure() && github.event.inputs.job_id != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          JOB_ID: ${{ github.event.inputs.job_id }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            curl --silent --show-error -X PATCH "$SUPABASE_URL/rest/v1/export_jobs?id=eq.$JOB_ID" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              -H "Prefer: return=minimal" \
              -d '{"status":"failed","error_message":"Android build failed. Check the build log.","updated_at":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"}'
          fi

      - name: Upload APK and AAB build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gamezaar-android-builds
          path: |
            android-export/android/app/build/outputs/apk/debug/app-debug.apk
            android-export/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
